<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Background circle -->
  <circle cx="60" cy="60" r="55" fill="#1E3A5F"/>
  
  <!-- Left bracket < -->
  <polyline points="40,40 22,60 40,80" 
            fill="none" stroke="#F97316" stroke-width="6" 
            stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Right bracket > -->
  <polyline points="80,40 98,60 80,80" 
            fill="none" stroke="#F97316" stroke-width="6" 
            stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Slash / -->
  <line x1="70" y1="36" x2="50" y2="84" 
        stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
</svg>